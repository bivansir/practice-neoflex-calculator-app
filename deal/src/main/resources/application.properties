spring.application.name=deal
server.port=8081

logging.level.root=INFO
logging.level.ru.neoflex.deal=DEBUG
logging.file.name=logs/dealservice.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{requestId}] %-5level %logger{36} - %msg%n

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/changelog-master.xml

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dealservice_db}
spring.datasource.username=${DB_USERNAME:dealservice_user}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.properties.spring.json.type.mapping=emailMessage:ru.neoflex.deal.dto.EmailMessage
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

kafka.topic.send-documents=${KAFKA_TOPIC_SEND_DOCUMENTS:send-documents}

calculator.calcservice.url=${CALCSERVICE_URL:http://localhost:8081}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
