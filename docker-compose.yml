version: '3.9'

services:
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_DB: dealservice_db
      POSTGRES_USER: dealservice_user
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  calcservice:
    build: ./calcservice
    container_name: calcservice
    ports:
      - "8081:8081"

  dealservice:
    build: ./deal
    container_name: dealservice
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/dealservice_db
      SPRING_DATASOURCE_USERNAME: dealservice_user
      SPRING_DATASOURCE_PASSWORD: admin
    ports:
      - "8082:8081"

volumes:
  db_data: