services:
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_DB: dealservice_db
      POSTGRES_USER: dealservice_user
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealservice_user -d dealservice_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
  
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  #TESTING
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  calcservice:
    build: ./calcservice
    container_name: calcservice
    ports:
      - "8081:8081"

  dealservice:
    build: ./deal
    container_name: dealservice
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      calcservice:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/dealservice_db
      SPRING_DATASOURCE_USERNAME: dealservice_user
      SPRING_DATASOURCE_PASSWORD: admin
    ports:
      - "8082:8081"

  dossier:
    build: ./dossier
    container_name: dossier
    depends_on:
      kafka:
        condition: service_healthy
      #TESTING
      mailpit:
        condition: service_started
    ports:
      - "8083:8081"

volumes:
  db_data: